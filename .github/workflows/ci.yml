name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      - run: pnpm -r test:unit
      - run: pnpm --filter @zilventor/kernel test:integration
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - name: Firefox smoke e2e
        run: pnpm test:e2e:firefox
      - run: pnpm -r build
      - name: Built-artifact e2e (kernel works in production build)
        run: |
          pnpm --filter @zilventor/app preview --port 5193 &
          for i in $(seq 1 60); do curl -sf http://localhost:5193 >/dev/null && break || sleep 1; done
          pnpm test:e2e:built
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  perf:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:perf
